<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nosotros - jaigomvil</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Sobre Nosotros</h1>
        <p>Conoce al equipo de desarrollo que hace posible esta plataforma.</p>
    </header>
    <main>
        <section class="equipo">
            <h2>Nuestra Misión</h2>
            <p>Somos un equipo comprometido con las buenas prácticas de desarrollo ágil y control de versiones con Git.</p>
        </section>
        <section class="contacto">
            <h2>Formulario de Contacto</h2>
            <form>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre"><br><br>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje"></textarea><br><br>
                <button type="button">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
